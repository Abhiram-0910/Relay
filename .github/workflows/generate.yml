name: relay-generate

# Triggered only by the Relay Worker via the workflow_dispatch REST API (Worker holds a
# fine-grained PAT with Actions: write). The Worker mints run_id and passes its own origin as
# callback_url; this job reports progress back to that Worker's KV using the shared CALLBACK_SECRET.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Worker-minted run id (KV key)"
        required: true
      spec_url:
        description: "OpenAPI/Swagger spec URL to process"
        required: true
      callback_url:
        description: "Worker base URL for progress callbacks"
        required: true
      has_byok:
        description: "Whether a BYOK key was stored for this run (\"true\"/\"false\"). Carries no key material — just a flag telling the runner to fetch one."
        required: false
        default: "false"

jobs:
  generate:
    runs-on: ubuntu-latest          # GitHub-hosted runner ships Docker for the sandbox
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Build sandbox images (relay-sandbox + relay-sidecar)
        run: make sandbox-build

      - name: Run pipeline
        working-directory: backend
        env:
          RELAY_RUN_ID: ${{ inputs.run_id }}
          RELAY_SPEC_URL: ${{ inputs.spec_url }}
          RELAY_CALLBACK_URL: ${{ inputs.callback_url }}
          RELAY_HAS_BYOK: ${{ inputs.has_byok }}
          # Shared secret authenticates callbacks to the Worker — NOT the built-in GITHUB_TOKEN.
          RELAY_CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.ci_runner

      # If the job dies before the runner reports a result (dep install, docker, OOM, timeout),
      # tell the Worker so the run shows "failed" instead of hanging at "queued" until TTL.
      #
      # `if: failure()` fires on ANY non-zero exit from "Run pipeline" -- which is EVERY classified
      # failure too, since run() (ci_runner.py) always re-raises after reporting (Step 3 didn't
      # change that, and an existing test depends on it). Found live (Step 4): this step used to fire
      # unconditionally and clobber whatever ci_runner.py had already correctly reported -- e.g. a
      # real spec_invalid run showed up as this generic message instead, silently destroying Step
      # 3's classification on every single failure in production. Guard: only send the generic
      # fallback if the run ISN'T ALREADY "failed" -- i.e. only for the cases this step actually
      # exists for (dep install/docker/OOM/timeout, none of which ever reach ci_runner.py's own
      # try/except). Fails OPEN: if the status check itself can't be read for any reason (network
      # hiccup, malformed JSON, curl error), `status` stays "unknown" -- never "failed" -- so the
      # fallback still fires rather than silently leaving the run stuck with no terminal state.
      - name: Report infra failure (only if the runner never got to report anything itself)
        if: failure()
        run: |
          status="unknown"
          if body=$(curl -sS -m 15 "${{ inputs.callback_url }}/api/runs/${{ inputs.run_id }}"); then
            status=$(echo "$body" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
          fi
          if [ "$status" != "failed" ]; then
            curl -sS -X POST "${{ inputs.callback_url }}/api/runs/${{ inputs.run_id }}/progress" \
              -H "Authorization: Bearer ${{ secrets.CALLBACK_SECRET }}" \
              -H "Content-Type: application/json" \
              -d '{"status":"failed","stage":"ci_error","error":"pipeline job failed before reporting a result"}'
          fi
